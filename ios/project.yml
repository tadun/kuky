name: KukyApp
options:
  bundleIdPrefix: com.tadun
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

targets:
  KukyApp:
    type: application
    platform: iOS
    sources:
      - path: KukyApp
    info:
      path: KukyApp/Info.plist
      properties:
        CFBundleDisplayName: Kuky
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: "Saves photos and videos from the robot camera."
        NSLocalNetworkUsageDescription: "Connects to the Kuky robot on your local Wi-Fi."
        NSBonjourServices:
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.tadun.KukyApp
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
